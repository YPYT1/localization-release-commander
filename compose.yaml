services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lrc
      POSTGRES_USER: lrc
      POSTGRES_PASSWORD: lrc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrc -d lrc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lrc-postgres:/var/lib/postgresql/data

volumes:
  lrc-postgres:
